name: Auto-merge Dependabot PRs

# Merge only after the PR build succeeded: the main ruleset has no required checks
# (GitHub Actions can't be a bypass actor, which the release push would need).
on:
  workflow_run:
    workflows: [ Build ]
    types: [ completed ]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      - name: Merge PR and build main
        run: |
          pr=$(gh pr list --repo "$REPO" --state open --author app/dependabot --json number,headRefOid \
            --jq ".[] | select(.headRefOid == \"$HEAD_SHA\") | .number")
          if [ -z "$pr" ]; then
            echo "No open Dependabot PR at $HEAD_SHA"
            exit 0
          fi
          gh pr merge "$pr" --repo "$REPO" --merge --match-head-commit "$HEAD_SHA"
          # Merges with GITHUB_TOKEN don't trigger push workflows
          gh workflow run build.yml --repo "$REPO" --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
